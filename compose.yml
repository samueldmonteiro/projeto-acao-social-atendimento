
name: atendimento-acao-social

services:

  # ───────────────────────────────
  # PostgreSQL
  # ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: atendimento-postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-net

  # ───────────────────────────────
  # NestJS API
  # ───────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: atendimento-api
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      NODE_ENV:     development
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    command: >
      sh -c "yarn install &&
             yarn prisma generate &&
             yarn prisma migrate deploy &&
             yarn run start:dev"

  # ───────────────────────────────
  # React Router / Vite Frontend
  # ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atendimento-frontend
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    restart: unless-stopped
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api
    networks:
      - frontend-net
    command: >
      sh -c "yarn install &&
             yarn run dev --host 0.0.0.0"

# ─────────────────────────────────────────────────────────────────────────────
# Volumes nomeados
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: atendimento-pgdata

# ─────────────────────────────────────────────────────────────────────────────
# Redes
# ─────────────────────────────────────────────────────────────────────────────
networks:
  backend-net:
    name: atendimento-backend-net
  frontend-net:
    name: atendimento-frontend-net